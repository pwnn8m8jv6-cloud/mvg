<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>U-Bahn Alte Heide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .departure {
      font-size: 36px;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }

    .time {
      color: #00ff99;
      font-weight: bold;
    }

    .error {
      color: red;
      font-size: 24px;
    }
  </style>
</head>
<body>

<h1>Alte Heide</h1>
<div id="departures">Lade Daten...</div>

<script>
const TARGET_URL = "https://www.mvg.de/api/fib/v2/departure?globalId=de:09162:70";

async function fetchWithFallback() {
  const proxies = [
    url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    url => "https://corsproxy.io/?" + encodeURIComponent(url)
  ];

  for (let proxy of proxies) {
    try {
      const res = await fetch(proxy(TARGET_URL));
      if (!res.ok) continue;
      return await res.json();
    } catch (e) {
      console.warn("Proxy fehlgeschlagen, versuche nächsten...");
    }
  }

  throw new Error("Alle Proxies fehlgeschlagen");
}

async function loadDepartures() {
  const container = document.getElementById("departures");

  try {
    const data = await fetchWithFallback();

    container.innerHTML = "";

    data.departures.slice(0, 8).forEach(dep => {
      const minutes = Math.max(0, Math.round(
        (new Date(dep.plannedDepartureTime).getTime() - Date.now()) / 60000
      ));

      const div = document.createElement("div");
      div.className = "departure";

      div.innerHTML = `
        <span>${dep.label} → ${dep.destination}</span>
        <span class="time">${minutes} min</span>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    container.innerHTML = "<div class='error'>⚠️ Keine Verbindung</div>";
    console.error(err);
  }
}

loadDepartures();
setInterval(loadDepartures, 30000);
</script>

</body>
</html>
