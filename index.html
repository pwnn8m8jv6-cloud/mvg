<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>U-Bahn Alte Heide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    .departure {
      font-size: 32px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    .line {
      font-weight: bold;
    }

    .time {
      color: #00ff99;
    }
  </style>
</head>
<body>

<h1>Alte Heide</h1>
<div id="departures">Lade Daten...</div>

<script>
async function loadDepartures() {
  try {
    // inoffizieller MVG Endpunkt
    const response = await fetch("https://www.mvg.de/api/fib/v2/departure?globalId=de:09162:70");

    const data = await response.json();

    const container = document.getElementById("departures");
    container.innerHTML = "";

    data.departures.slice(0, 10).forEach(dep => {
      const div = document.createElement("div");
      div.className = "departure";

      const minutes = Math.round((new Date(dep.plannedDepartureTime).getTime() - Date.now()) / 60000);

      div.innerHTML = `
        <span class="line">${dep.label} → ${dep.destination}</span>
        <span class="time">${minutes} min</span>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    document.getElementById("departures").innerText = "Fehler beim Laden";
    console.error(err);
  }
}

// initial laden
loadDepartures();

// alle 30 Sekunden aktualisieren
setInterval(loadDepartures, 30000);
</script>

</body>
</html>
